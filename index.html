<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3c94d">
  <title>新郎新婦サンレンタン</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-icon">💍</div>
      <p class="eyebrow">WEDDING PARTY QUIZ</p>
      <h1>新郎新婦<br>サンレンタン</h1>
      <p class="hero-copy">1位〜3位を予想して回答してください！</p>
    </header>

    <section id="loading-screen" class="card">
      <p>接続中です…</p>
    </section>

    <section id="team-screen" class="card" hidden>
      <h2>チームを選択</h2>
      <p class="subtle">同じテーブルの方は、同じチーム名を選択してください。</p>

      <label class="field-label" for="team-select">あなたのチーム</label>
      <select id="team-select" class="select">
        <option value="">選択してください</option>
      </select>

      <button id="start-button" class="button button-primary">ゲームに参加する</button>
    </section>

<section
  id="question-screen"
  class="card"
  hidden
>

  <!-- サンレンタン得点表：回答受付中・締切中どちらでも表示 -->
  <div class="score-guide" aria-label="得点ルール">
    <div class="score-guide-title">🏆 得点ルール</div>

    <div class="score-guide-list">
      <div class="score-guide-row score-max">
        <span class="score-point">6点</span>
        <span class="score-description">1〜3位すべて順位まで一致</span>
      </div>

      <div class="score-guide-row">
        <span class="score-point">4点</span>
        <span class="score-description">3つすべて的中・順位違い</span>
      </div>

      <div class="score-guide-row">
        <span class="score-point">3点</span>
        <span class="score-description">1位・2位が順位まで一致</span>
      </div>

      <div class="score-guide-row">
        <span class="score-point">2点</span>
        <span class="score-description">3つのうち2つが的中</span>
      </div>

      <div class="score-guide-row">
        <span class="score-point">1点</span>
        <span class="score-description">1位が的中</span>
      </div>

      <div class="score-guide-row score-zero">
        <span class="score-point">0点</span>
        <span class="score-description">上記以外</span>
      </div>
    </div>
  </div>

  <div class="question-top">
    <div>
      <p id="question-number" class="question-number"></p>
    </div>
  </div>

  <div id="team-badge" class="team-badge"></div>

  <!-- 締切中はこれだけ表示 -->
  <div
    id="closed-message"
    class="status status-closed"
  >
    🔒 この問題は現在、回答を受け付けていません。<br>
    司会の案内をお待ちください。
  </div>

  <!-- 回答受付中だけ表示 -->
  <div id="question-content" hidden>

    <h2
      id="question-title"
      class="question-title"
    ></h2>

    <div
      id="choice-list"
      class="choice-list"
    ></div>

    <div class="ranking-box">

      <h3>1位〜3位を予想</h3>

      <label class="rank-row">
        <span class="rank-medal">🥇 1位</span>
        <select
          id="rank1"
          class="select rank-select"
        ></select>
      </label>

      <label class="rank-row">
        <span class="rank-medal">🥈 2位</span>
        <select
          id="rank2"
          class="select rank-select"
        ></select>
      </label>

      <label class="rank-row">
        <span class="rank-medal">🥉 3位</span>
        <select
          id="rank3"
          class="select rank-select"
        ></select>
      </label>

    </div>

    <div
      id="status"
      class="status status-open"
    >
      🟢 回答受付中
    </div>

    <div
      id="message"
      class="message"
      aria-live="polite"
    ></div>

    <button
      id="submit-button"
      class="button button-primary"
      disabled
    >
      回答を送信
    </button>

  </div>

  <div class="navigation">

    <button
      id="previous-button"
      class="button button-secondary"
    >
      ← 前へ
    </button>

    <button
      id="next-button"
      class="button button-secondary"
    >
      次へ →
    </button>

  </div>

</section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
